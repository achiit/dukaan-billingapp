</style></head><body>
<div id="login"><div class="box"><h2 id="lc" style="margin-top:0;text-align:center">Sign in</h2><img id="ll" style="max-width:100%;display:none;margin:0 auto 10px">
<label>Username</label><input id="lu" autocomplete="username"><label style="margin-top:10px">Password</label><input id="lp" type="password" autocomplete="current-password">
<p id="le" style="color:#c0392b;min-height:18px;margin:8px 0"></p><button class="b" style="width:100%" onclick="login()">Login</button></div></div>
<div id="app"><div id="bar"><button class="b" onclick="$('side').classList.toggle('open')">&#9776; Menu</button><span id="bt"></span></div><div id="side"></div><div id="main"></div></div><div id="pa"></div>
<script>
const FORMS={items:"Item Master",sales:"Sales",report:"Sales Report",dash:"Sales Dashboard",users:"Users",access:"Form Access",company:"Company Settings",excel:"Excel Storage",imp:"Import from Excel",reset:"Reset Data"};
const ADMIN=["users","access","company","excel","imp","reset"],REPORTS=["report","dash"];
let D={users:[{u:"admin",p:"a",role:"admin",on:true}],access:{},items:[],sales:[],co:{name:"Mobile World",addr:"",phone:"",gst:"",email:"",logo:"",bg:""},seq:1};
let LOCAL=null;try{const s=localStorage.getItem("bill_d");if(s){LOCAL=JSON.parse(s);D=Object.assign(D,LOCAL)}}catch(e){}
norm();let me=null,fh=null,cur="";
const $=i=>document.getElementById(i),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),L=s=>String(s).trim().toLowerCase();
const J=JSON.stringify;let DB=null,syncMsg="Connecting...";const HID=Math.random().toString(36).slice(2);let last={},q=Promise.resolve();
function setSync(m){syncMsg=m;const e=$("sy");if(e)e.textContent=m}
function parts(){const co={...D.co},lg=co.logo||"",bg=co.bg||"";delete co.logo;delete co.bg;const p={"app/users":{list:D.users},"app/access":{map:D.access},"app/items":{list:D.items},"app/co":co,"app/logo":{d:lg},"app/bg":{d:bg},"app/resetlog":{list:D.resetlog||[]}};D.sales.forEach(x=>p["sales/"+x.no]=x);return p}
async function doSave(){try{localStorage.setItem("bill_d",J(D))}catch(e){}
if(DB){const p=parts();let bad="";for(const k of Object.keys(last))if(k.startsWith("sales/")&&!(k in p)){try{await DB.doc(k).delete();delete last[k]}catch(e){bad="Could not delete from the shared database ("+(e.code||"error")+")."}}for(const k in p){const t=J(p[k]);if(last[k]===t)continue;if(t.length>250000){bad="An image is too large to share. Upload a smaller logo or background in Company Settings.";continue}
try{await DB.doc(k).set(p[k]);last[k]=t}catch(e){bad="Could not save to the shared database ("+(e.code||"error")+"). You may have view-only access. Changes are kept on this device only."}}
if(bad){setSync("Not synced");alert(bad)}else setSync("Synced on all devices")}
await sync()}
function save(){return q=q.then(doSave).catch(()=>{})}
function loc(){const mx=Math.max(0,...D.sales.map(x=>parseInt(String(x.no).slice(3))||0));const n=Math.max(D.seq,mx+1);D.seq=n+1;return n}
async function getNo(){if(!DB)return loc();const ref=DB.doc("app/seq");
for(let t=0;t<10;t++){try{const r=await ref.acquire({holder:HID,ttlMs:5000});if(r.acquired){const sn=await ref.get(),mx=Math.max(0,...D.sales.map(x=>parseInt(String(x.no).slice(3))||0)),n=Math.max(sn.exists?(sn.data().n||1):1,mx+1);await ref.set({n:n+1});D.seq=n+1;return n}}catch(e){break}await new Promise(r=>setTimeout(r,400+Math.random()*400))}
return loc()}
function dlOpts(){return D.items.filter(x=>x.on).map(x=>`<option value="${E(lb(x))}">`).join("")}
function chg(){clearTimeout(chg.t);chg.t=setTimeout(()=>{brand();if(!me)return;menu();document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("a",n.dataset.k==cur));
if(cur=="report"||cur=="dash"){go(cur);return}if(["items","users","sales"].includes(cur)){const t=document.createElement("div");t.innerHTML=R[cur]();const n=t.querySelectorAll(".card"),o=document.querySelectorAll("#main .card");if(n.length&&n.length==o.length)o[o.length-1].replaceWith(n[n.length-1]);const d=$("dl");if(d)d.innerHTML=dlOpts()}},150)}
let xs="";
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("bill_fh",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function idbSet(k,v){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction("h","readwrite");v==null?t.objectStore("h").delete(k):t.objectStore("h").put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((ok,no)=>{const r=d.transaction("h").objectStore("h").get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const fhReady=(async()=>{try{fh=(await idbGet("excel"))||null}catch(e){}})();
async function perm(ask){if(!fh)return false;try{const o={mode:"readwrite"};let p=await fh.queryPermission(o);if(p!="granted"&&ask)p=await fh.requestPermission(o);return p=="granted"}catch(e){return false}}
async function sync(){if(!fh)return;try{if(!await perm(false)){xs="needs permission: press Allow access here, or log in again";return}const w=await fh.createWritable();await w.write(wb());await w.close();xs="last saved "+new Date().toLocaleTimeString()}catch(e){xs="could not write: "+e.message}}
function norm(){D.items.forEach(x=>{if(x.rate==null)x.rate=+x.price||0;if(x.mrp==null)x.mrp=+x.price||0})}
const rateOf=x=>x.rate!=null?x.rate:(D.items.find(i=>L(i.name)==L(x.item)&&L(i.model||"")==L(x.model||""))||{}).rate||0;
function det(r){return r.model||r.det||""}
function ymd(s){if(s.ymd)return s.ymd;const p=String(s.date||"").split(/[\/\-.]/);return p.length==3&&p[2].length==4?p[2]+"-"+p[1].padStart(2,"0")+"-"+p[0].padStart(2,"0"):""}
const fd=y=>y?y.split("-").reverse().join("/"):"";
let rf=new Date().toLocaleDateString("en-CA"),rt=rf;
function fs(){return D.sales.filter(s=>{const d=ymd(s);return(!rf||d>=rf)&&(!rt||d<=rt)})}
const mgn=S=>S.reduce((a,s)=>a+s.rows.reduce((b,x)=>b+((x.price||0)-rateOf(x))*(x.qty||1),0)-(+s.disc||0),0);
function rep(){const r=[];fs().forEach(s=>s.rows.forEach(x=>{const rc=rateOf(x);r.push({"Invoice No":s.no,"Sales Date":s.date,Item:x.item,Details:det(x),Person:s.person,Mobile:s.mobile,Address:s.addr,Payment:s.pay||"Cash",Rate:rc,MRP:x.price,Qty:x.qty,Total:x.price*x.qty,Margin:x.price-rc})}));return r}
function wb(){const b=XLSX.utils.book_new(),A=(n,r)=>XLSX.utils.book_append_sheet(b,XLSX.utils.json_to_sheet(r.length?r:[{}]),n);
A("Users",D.users.map(u=>({Username:u.u,Password:u.p,Role:u.role,Active:u.on?"Yes":"No"})));
A("Items",D.items.map(i=>({Name:i.name,Model:i.model,Rate:i.rate,MRP:i.mrp,Active:i.on?"Active":"Inactive"})));
A("Access",Object.entries(D.access).map(([u,f])=>({Username:u,Forms:f.join(",")})));
const sr=[];D.sales.forEach(s=>s.rows.forEach(x=>sr.push({"Invoice No":s.no,Date:s.date,Time:s.time,Person:s.person,Mobile:s.mobile,Address:s.addr,Payment:s.pay||"",Discount:s.disc||0,Item:x.item,Model:x.model||"",Qty:x.qty,MRP:x.price,Rate:rateOf(x),Total:x.price*x.qty})));A("Sales",sr);
A("Company",[{Name:D.co.name,Address:D.co.addr,Phone:D.co.phone,GST:D.co.gst,Email:D.co.email}]);return XLSX.write(b,{bookType:"xlsx",type:"array"})}
async function login(){$("le").textContent="";await fhReady;if(fh&&await perm(true))sync();await ready;if(DB&&!window._w){await new Promise(r=>setTimeout(r,1200));window._w=1}const u=L($("lu").value),p=L($("lp").value),f=D.users.find(x=>L(x.u)==u&&L(x.p)==p&&x.on);
if(!f){$("le").textContent="Wrong username or password";return}me=f;$("login").style.display="none";$("app").classList.add("on");menu();go(allowed()[0]||"")}
function allowed(){return me.role=="admin"?Object.keys(FORMS):(D.access[me.u]||[]).filter(f=>FORMS[f])}
function menu(){$("bt").textContent=D.co.name||"";const a=allowed(),b=k=>`<button class="nav" data-k="${k}" onclick="go('${k}')">${FORMS[k]}</button>`,fm=a.filter(k=>!ADMIN.includes(k)&&!REPORTS.includes(k)),rp=a.filter(k=>REPORTS.includes(k)),ad=a.filter(k=>ADMIN.includes(k));
$("side").innerHTML=`<h2 style="display:flex;align-items:center;gap:8px">${D.co.logo?`<img src="${D.co.logo}" alt="" style="height:36px;max-width:56px;object-fit:contain;background:#fff;border-radius:4px;padding:2px">`:""}<span>${E(D.co.name)}</span></h2><div class="u">User: ${E(me.u)}</div><small>Forms</small>${fm.map(b).join("")}${rp.length?"<small>Reports</small>"+rp.map(b).join(""):""}${ad.length?"<small>Admin</small>"+ad.map(b).join(""):""}<button class="nav" style="margin-top:14px" onclick="location.reload()">Logout</button>`}
function go(k){cur=k;if(k!="sales"){sbShow=false;sbQ=sbD=""}pkClose();$("side").classList.remove("open");document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("a",n.dataset.k==k));$("main").innerHTML=k?R[k]():"<p>No forms assigned. Ask the admin for access.</p>";if(k&&I[k])I[k]()}
const v=i=>$(i).value;
const R={},I={};
// ---------- Item master
let ei=-1;
R.items=()=>`<div class="card"><h3>Item Master</h3><div class="g"><div><label>Item name</label><input id="in"></div><div><label>Item model</label><input id="im"></div><div><label>Rate</label><input id="ir" type="number" inputmode="decimal"></div><div><label>MRP</label><input id="ip" type="number" inputmode="decimal"></div><div><label>Status</label><select id="ia"><option value="1">Active</option><option value="0">Inactive</option></select></div></div>
<button class="b" onclick="itSave()">Save</button><button class="b s" onclick="itClear()">Clear</button></div><div class="card tw"><table><tr><th>Name</th><th>Model</th><th>Rate</th><th>MRP</th><th>Status</th><th></th></tr>${D.items.map((x,i)=>`<tr><td>${E(x.name)}</td><td>${E(x.model)}</td><td>${m(x.rate)}</td><td>${m(x.mrp)}</td><td>${x.on?"Active":"Inactive"}</td><td><button class="b s" onclick="itEdit(${i})">Update</button></td></tr>`).join("")}</table></div>`;
async function itSave(){if(!v("in").trim()){alert("Enter item name");return}const o={name:v("in"),model:v("im"),rate:+v("ir")||0,mrp:+v("ip")||0,on:v("ia")=="1"};ei<0?D.items.push(o):D.items[ei]=o;ei=-1;await save();go("items")}
function itEdit(i){const x=D.items[i];ei=i;[["in",x.name],["im",x.model],["ir",x.rate],["ip",x.mrp],["ia",x.on?1:0]].forEach(([a,b])=>$(a).value=b);scrollTo(0,0)}
function itClear(){ei=-1;document.querySelectorAll("#main .card:first-child input").forEach(i=>i.value="");$("ia").value="1"}
// ---------- Users
let eu=-1;
R.users=()=>`<div class="card"><h3>Create / Update User</h3><div class="g"><div><label>Username</label><input id="uu"></div><div><label>Password</label><input id="up"></div><div><label>Role</label><select id="ur"><option>user</option><option>admin</option></select></div><div><label>Status</label><select id="ua"><option value="1">Active</option><option value="0">Inactive</option></select></div></div>

async function usSave(){const u=v("uu").trim();if(!u||!v("up")){alert("Enter username and password");return}if(D.users.some((x,i)=>L(x.u)==L(u)&&i!=eu)){alert("Username already exists");return}

function fl(el,k){const f=el.files[0];if(!f)return;const im=new Image();im.onload=()=>{const mx=k=="logo"?360:1100,r=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const d=c.toDataURL(k=="logo"?"image/png":"image/jpeg",.75);if(d.length>230000){alert("Image is too large. Choose a smaller image.");return}D.co[k]=d;alert("Image loaded. Press Save.")};im.onerror=()=>alert("Could not read the image");im.src=URL.createObjectURL(f)}

let pkI=-1;
function pkOpen(i){pkI=i;let b=$("pkm");if(!b){b=document.createElement("div");b.id="pkm";document.body.appendChild(b)}
b.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px";
b.innerHTML=`<div style="background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;width:100%;max-width:560px;max-height:85%;display:flex;flex-direction:column;padding:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="margin:0">Select item</h3><button class="b s" onclick="pkClose()">Close</button></div><input id="pks" placeholder="Search item name or model" oninput="pkList()" autocomplete="off"><div id="pkl" style="overflow:auto;margin-top:8px"></div></div>`;pkList();$("pks").focus()}
function pkList(){const q=L($("pks").value);let h="";D.items.forEach((x,i)=>{if(x.on&&(!q||L(lb(x)).includes(q)))h+=`<div onclick="pkPick(${i})" style="padding:9px 10px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;justify-content:space-between;gap:10px"><span>${E(x.name)} <small style="color:var(--mu)">${E(x.model)}</small></span><b>₹${m(x.mrp)}</b></div>`});
$("pkl").innerHTML=h||'<p style="color:var(--mu)">No items found in Item Master.</p>'}
function pkPick(i){const x=D.items[i];if(!x||pkI<0)return;rows[pkI]={item:x.name,model:x.model,rate:x.rate,price:x.mrp,qty:rows[pkI].qty||1};pkClose();og()}
function pkClose(){const b=$("pkm");if(b)b.remove()}
I.sales=()=>{rows=[{}];editNo="";og()};
function og(){const g=$("og");if(!g)return;const ro=x=>`<td><input readonly value="${E(x??"")}"></td>`;g.innerHTML=`<tr><th>Sl</th><th>Item name</th><th>Model</th><th>Qty</th><th>MRP</th><th>Total</th><th></th></tr>`+rows.map((r,i)=>`<tr><td>${i+1}</td><td style="min-width:150px"><input readonly style="cursor:pointer" value="${E(r.item||"")}" placeholder="🔍 Click to search item" onclick="pkOpen(${i})"></td>${ro(r.model)}<td><input type="number" min="1" value="${r.qty||1}" onchange="rows[${i}].qty=Math.max(1,+this.value||1);og()"></td>${ro(r.price||0)}${ro((r.price||0)*(r.qty||1))}<td><button class="b s" onclick="rows.splice(${i},1);if(!rows.length)rows=[{}];og()">x</button></td></tr>`).join("");
const t=tot();$("s1").value=t.sub;$("s3").value=t.total}

function pkSel(i,val){if(!val.trim()){rows[i]={qty:rows[i].qty};og();return}const on=D.items.filter(x=>x.on);let l=on.filter(x=>L(lb(x))==L(val));if(!l.length)l=on.filter(x=>L(x.name)==L(val));
if(l.length!=1){alert(l.length?"This item has several models. Pick the exact one from the suggestions.":"Item not found in Item Master");rows[i]={qty:rows[i].qty};og();return}
const x=l[0];rows[i]={item:x.name,model:x.model,rate:x.rate,price:x.mrp,qty:rows[i].qty||1};og()}

function cur0(){const rs=rows.filter(r=>r.item),t=tot(rs);return{no:"(unsaved)",date:new Date().toLocaleDateString("en-IN"),ymd:new Date().toLocaleDateString("en-CA"),time:new Date().toLocaleTimeString("en-IN"),person:v("sp"),mobile:v("sm"),addr:v("sa"),pay:v("sx"),rows:rs,...t}}

if(editNo){const i=D.sales.findIndex(x=>x.no==editNo),o=D.sales[i];D.sales[i]={...n,no:o.no,date:o.date,ymd:o.ymd||ymd(o),time:o.time,edited:new Date().toLocaleString("en-IN")};await save();alert("Invoice "+o.no+" updated");go("sales");return}
n.no="MW-"+String(await getNo()).padStart(4,"0");D.sales.push(n);await save();alert("Saved. Invoice "+n.no);go("sales")}

function words(n){n=Math.round(n);const a="One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen".split(" "),b=" , ,Twenty,Thirty,Forty,Fifty,Sixty,Seventy,Eighty,Ninety".split(","),f=n=>n<20?a[n-1]||"":b[n/10|0].trim()+(n%10?" "+a[n%10-1]:""),g=n=>(n>99?a[(n/100|0)-1]+" Hundred"+(n%100?" ":""):"")+f(n%100);let s="";[[1e7,"Crore"],[1e5,"Lakh"],[1e3,"Thousand"]].forEach(([d,l])=>{if(n>=d){s+=g(n/d|0)+" "+l+" ";n%=d}});return(s+g(n)).trim()+" Only"}

<h3>3. Sales Details</h3><table><tr><th>Invoice</th><th>Sales date</th><th>Item</th><th>Details</th><th>Person</th><th>Mobile</th><th>Address</th><th>Payment</th><th class="r">Rate</th><th class="r">MRP</th><th class="c">Qty</th><th class="r">Total</th></tr>${rr.map(r=>`<tr><td>${r["Invoice No"]}</td><td>${r["Sales Date"]}</td><td>${E(r.Item)}</td><td>${E(r.Details)}</td><td>${E(r.Person)}</td><td>${E(r.Mobile)}</td><td>${E(r.Address)}</td><td>${E(r.Payment)}</td><td class="r">${m(r.Rate)}</td><td class="r">${m(r.MRP)}</td><td class="c">${r.Qty}</td><td class="r">${m(r.Total)}</td></tr>`).join("")}</table>
<div class="sg"><span>Prepared By</span><span>Checked By</span><span>Owner / Manager Signature</span></div></div>`;print()}
function dl(){const b=XLSX.utils.book_new();XLSX.utils.book_append_sheet(b,XLSX.utils.json_to_sheet(rep().map(({Margin,...r})=>r)),"Sales Report");saveFile("sales-report.xlsx",new Blob([XLSX.write(b,{bookType:"xlsx",type:"array"})]))}
// ---------- Sales Dashboard
let dsF=new Date().toLocaleDateString("en-CA"),dsT=dsF;
function dsh(){const S=D.sales.filter(s=>{const d=ymd(s);return(!dsF||d>=dsF)&&(!dsT||d<=dsT)});let mrp=0,rate=0,disc=0;S.forEach(s=>{disc+=+s.disc||0;s.rows.forEach(x=>{const q=x.qty||1;mrp+=(x.price||0)*q;rate+=rateOf(x)*q})});const net=mrp-disc;return{n:S.length,mrp,disc,net,rate,mg:net-rate}}
R.dash=()=>{const d=dsh(),bx=(t,v,s,c)=>`<div class="card" style="margin:0;border-left:5px solid ${c}"><div style="color:var(--mu);font-size:13px">${t}</div><div style="font-size:26px;font-weight:700;margin:6px 0">₹${m(v)}</div><div style="color:var(--mu);font-size:12px">${s}</div></div>`;
return`<div class="card"><h3>Sales Dashboard</h3><div class="g"><div><label>From date</label><input type="date" id="ds1" value="${dsF}" onchange="dsF=this.value;go('dash')"></div><div><label>To date</label><input type="date" id="ds2" value="${dsT}" onchange="dsT=this.value;go('dash')"></div></div>
<button class="b s" onclick="dsF=dsT=new Date().toLocaleDateString('en-CA');go('dash')">Today</button><button class="b s" onclick="dsF=dsT='';go('dash')">All dates</button>
<p style="margin:10px 0 0"><b>${d.n}</b> bills &nbsp; <span style="color:var(--mu)">${dsF||dsT?(fd(dsF)||"start")+" to "+(fd(dsT)||"today"):"All dates"}</span></p></div>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${bx("1) Total MRP Sales",d.mrp,"Qty × MRP","#0b4ea2")}${bx("2) Total Discount Sales",d.disc,"Discount given on bills","#c0392b")}${bx("3) Total Net Sales",d.net,"MRP sales − Discount","#1e8e3e")}${bx("4) Total Rate Sales",d.rate,"Qty × Rate","#8e44ad")}${bx("5) Margin on Sales",d.mg,"Net sales − Rate sales","#e67e22")}</div>`};
// ---------- Excel storage
R.excel=()=>`<div class="card"><h3>Excel Storage</h3><p>Choose an Excel file once. It stays connected after you refresh or reopen the page, and every save or update is written into it automatically (Users, Items, Access, Sales, Company sheets).</p><button class="b" onclick="pickX()">${fh?"Change Excel file":"Select Excel file"}</button>${fh?`<button class="b s" onclick="allowX()">Allow access</button><button class="b s" onclick="offX()">Disconnect</button>`:""}<button class="b s" onclick="dlAll()">Download backup now</button><p id="xs" style="color:var(--mu)">${fh?"Connected: "+E(fh.name)+(xs?" - "+E(xs):""):"No file selected"}</p><p style="color:var(--mu);font-size:12px">Tip: on a computer, pick a file inside your Google Drive folder and Google Drive keeps it synced online. Choosing a file works in Chrome or Edge on a computer. Phones can't write to a chosen file, so use Download backup there.</p></div>`;
async function pickX(){if(!window.showSaveFilePicker){alert("This browser cannot write to a chosen file. Use Chrome or Edge on a computer, or use Download backup.");return}
try{fh=await showSaveFilePicker({suggestedName:"billing-data.xlsx",types:[{description:"Excel",accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}]});try{await idbSet("excel",fh)}catch(e){}await sync();go("excel")}catch(e){if(e.name!="AbortError")alert("Could not open the file here: "+e.message)}}
async function allowX(){if(await perm(true))await sync();go("excel")}
async function offX(){if(!confirm("Disconnect this Excel file?"))return;fh=null;xs="";try{await idbSet("excel",null)}catch(e){}go("excel")}
function dlAll(){saveFile("billing-data.xlsx",new Blob([wb()]))}
// ---------- Reset
R.reset=()=>`<div class="card"><h3>Reset Data</h3><p style="color:#c0392b"><b>Warning:</b> this permanently deletes all items, sales bills, form access, other users and company details on every device. Your own admin login stays. It cannot be undone, so download a backup first.</p><div class="g"><div><label>Your password</label><input id="rp" type="password" autocomplete="current-password"></div><div><label>Reason for deleting the data</label><input id="rr" placeholder="Why is the data being deleted?"></div></div><button class="b" style="background:#c0392b;color:#fff" onclick="doReset()">Reset all data</button><button class="b s" onclick="dlAll()">Download backup first</button><button class="b s" onclick="go('reset')">Clear</button></div>${(D.resetlog||[]).length?`<div class="card tw"><h3>Reset history</h3><table><tr><th>When</th><th>By</th><th>Reason</th></tr>${D.resetlog.slice().reverse().map(x=>`<tr><td>${E(x.at)}</td><td>${E(x.by)}</td><td>${E(x.why)}</td></tr>`).join("")}</table></div>`:""}`;
async function doReset(){const why=v("rr").trim();if(L(v("rp"))!=L(me.p)){alert("Wrong password");return}if(why.length<5){alert("Enter a reason (at least 5 characters)");return}
if(!confirm("Delete ALL data permanently? This cannot be undone."))return;
const ad={...me};D.items=[];D.sales=[];D.access={};D.users=[ad];D.co={name:"My Company",addr:"",phone:"",gst:"",email:"",logo:"",bg:""};D.seq=1;D.resetlog=(D.resetlog||[]).concat([{at:new Date().toLocaleString("en-IN"),by:me.u,why}]);me=D.users[0];
await save();if(DB){try{await DB.doc("app/seq").set({n:1})}catch(e){}}brand();menu();alert("All data has been deleted.");go("reset")}
// ---------- Import
R.imp=()=>`<div class="card"><h3>Import from Excel</h3><p>Choose the Excel file this app stored (sheets: Users, Items, Access, Sales, Company) or a backup from Excel Storage.</p><div class="g"><div><label>Excel file</label><input type="file" id="xf" accept=".xlsx,.xls"></div><div><label>Import mode</label><select id="xm"><option value="merge">Add / update (keep existing data)</option><option value="replace">Replace all existing data</option></select></div></div><button class="b" onclick="doImport()">Import</button><button class="b s" onclick="go('imp')">Clear</button><p id="xr" style="color:var(--mu)"></p></div>`;
async function doImport(){const f=$("xf").files[0];if(!f){alert("Choose an Excel file first");return}const rp=v("xm")=="replace";if(rp&&!confirm("Replace ALL existing data with the data in this file?"))return;
let w;try{w=XLSX.read(await f.arrayBuffer(),{type:"array"})}catch(e){alert("Could not read this file");return}
const S=n=>w.Sheets[n]?XLSX.utils.sheet_to_json(w.Sheets[n],{defval:"",raw:false}):[],g=(r,...k)=>{for(const x of k)if(r[x]!==undefined&&r[x]!=="")return r[x];return""},n0=x=>+String(x).replace(/,/g,"")||0;
const U=S("Users"),IT=S("Items"),A=S("Access"),SL=S("Sales"),C=S("Company");
if(!U.length&&!IT.length&&!SL.length&&!C.length){alert("No data found. Expected sheets: Users, Items, Access, Sales, Company.");return}
if(rp){D.items=[];D.sales=[];D.access={};D.users=D.users.filter(u=>L(u.u)==L(me.u))}
const c={u:0,i:0,s:0};
U.forEach(r=>{const u=String(g(r,"Username")).trim();if(!u)return;const pw=String(g(r,"Password")),role=L(g(r,"Role"))=="admin"?"admin":"user",on=L(g(r,"Active")||"yes")!="no",e=D.users.find(x=>L(x.u)==L(u));
if(e){if(pw)e.p=pw;if(e!==D.users[0]&&L(e.u)!=L(me.u)){e.role=role;e.on=on}}else{D.users.push({u,p:pw||"1234",role,on});c.u++}});
IT.forEach(r=>{const name=String(g(r,"Name")).trim();if(!name)return;const model=String(g(r,"Model")).trim(),pr=n0(g(r,"Price")),o={name,model,rate:g(r,"Rate")!==""?n0(g(r,"Rate")):pr,mrp:g(r,"MRP")!==""?n0(g(r,"MRP")):pr,on:L(g(r,"Active")||"active")!="inactive"},e=D.items.findIndex(x=>L(x.name)==L(name)&&L(x.model||"")==L(model));if(e<0){D.items.push(o);c.i++}else D.items[e]=o});
A.forEach(r=>{const u=String(g(r,"Username")).trim();if(u)D.access[u]=String(g(r,"Forms")).split(",").map(x=>x.trim()).filter(k=>FORMS[k])});
if(C[0]){const map={name:"Name",addr:"Address",phone:"Phone",gst:"GST",email:"Email"};for(const k in map){const x=g(C[0],map[k]);if(x!=="")D.co[k]=String(x)}}
const bills={};SL.forEach(r=>{const no=String(g(r,"Invoice No")).trim();if(no)(bills[no]=bills[no]||[]).push(r)});
Object.entries(bills).forEach(([no,rs])=>{if(D.sales.some(x=>x.no==no))return;const r0=rs[0],rw=rs.map(r=>{const x={item:String(g(r,"Item")),model:String(g(r,"Model","Details")),price:n0(g(r,"MRP","Price")),qty:n0(g(r,"Qty"))||1};if(g(r,"Rate")!=="")x.rate=n0(g(r,"Rate"));return x}),sub=rw.reduce((a,x)=>a+x.price*x.qty,0),disc=n0(g(r0,"Discount"));
const o={no,date:String(g(r0,"Date","Sales Date")),time:String(g(r0,"Time")),person:String(g(r0,"Person")),mobile:String(g(r0,"Mobile")),addr:String(g(r0,"Address")),pay:String(g(r0,"Payment"))||"Cash",rows:rw,sub,disc,total:Math.round((sub-disc)*100)/100};o.ymd=ymd(o);D.sales.push(o);c.s++});
D.seq=Math.max(D.seq,Math.max(0,...D.sales.map(x=>parseInt(String(x.no).slice(3))||0))+1);norm();await save();if(DB){try{await DB.doc("app/seq").set({n:D.seq})}catch(e){}}brand();menu();
const t="Imported: "+c.u+" new users, "+c.i+" new items, "+c.s+" new bills. Existing items and users were updated. New users without a password in the file get password 1234.";$("xr").textContent=t;alert(t)}
const ready=(async()=>{DB=null;
if(!DB)return;
const er=e=>{if(e&&e.code=="revoked")setSync("Access removed")};
if(LOCAL){try{const m=await DB.doc("app/meta").get();if(!m.exists){last={};await doSave();await DB.doc("app/seq").set({n:D.seq||1});await DB.doc("app/meta").set({migrated:1})}}catch(e){}}
const H={"app/users":d=>{D.users=d.list||D.users},"app/access":d=>{D.access=d.map||{}},"app/items":d=>{D.items=d.list||[];norm()},"app/resetlog":d=>{D.resetlog=d.list||[]},"app/co":d=>{Object.assign(D.co,d)},"app/logo":d=>{D.co.logo=d.d||""},"app/bg":d=>{D.co.bg=d.d||""},"app/seq":d=>{D.seq=d.n||1}};
for(const k in H)DB.doc(k).onSnapshot(sn=>{if(sn.exists){H[k](sn.data());if(k!="app/seq")last[k]=J(parts()[k])}chg()},er);
DB.collection("sales").onSnapshot(sn=>{if(sn.metadata.fromCache&&sn.empty)return;D.sales=sn.docs.map(d=>d.data()).sort((a,b)=>a.no<b.no?-1:1);Object.keys(last).forEach(k=>{if(k.startsWith("sales/"))delete last[k]});sn.docs.forEach(d=>{last["sales/"+d.id]=J(d.data())});chg()},er);
setSync("Synced on all devices")})();
brand();$("lp").addEventListener("keydown",e=>{if(e.key=="Enter")login()});
</script></body></html>
